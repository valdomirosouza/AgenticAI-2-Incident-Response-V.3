[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "log-ingestion-and-metrics"
version = "0.1.0"
description = "HAProxy log ingestion and Golden Signal metrics service for the Incident Response Copilot"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Valdomiro de Oliveira Souza Júnior", email = "valdomirojr@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "redis[hiredis]>=5.0.4",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "testcontainers[redis]>=4.5.0",
    "fakeredis>=2.23.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "import-linter>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Testing ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast unit tests (no I/O)",
    "integration: integration tests (require live Redis via testcontainers)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

# ── Coverage ───────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

# ── Ruff ───────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "UP",
    "S",
    "ANN",
]
ignore = [
    "ANN101",
    "ANN102",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

# ── Mypy ───────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

# ── import-linter ──────────────────────────────────────────────────────────────

[tool.importlinter]
root_packages = ["log_ingestion"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain independence"
type = "forbidden"
source_modules = ["log_ingestion.domain"]
forbidden_modules = ["log_ingestion.adapters", "log_ingestion.api"]

[[tool.importlinter.contracts]]
name = "Ports independence"
type = "forbidden"
source_modules = ["log_ingestion.ports"]
forbidden_modules = ["log_ingestion.adapters", "log_ingestion.api"]

[[tool.importlinter.contracts]]
name = "Adapters no API"
type = "forbidden"
source_modules = ["log_ingestion.adapters"]
forbidden_modules = ["log_ingestion.api"]
