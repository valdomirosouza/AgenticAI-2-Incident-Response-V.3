# G08 — No hard-coded credentials or API keys in Python source or config files.
# Secrets must be read from environment variables or a secrets manager (Vault).
# References: RULE-C03, ADR-0020, CWE-798

rules:
  - id: hardcoded-api-token
    patterns:
      - pattern: $VAR = "$TOKEN"
      - metavariable-regex:
          metavariable: $TOKEN
          regex: "(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{36,}|ghs_[A-Za-z0-9]{36,}|xoxb-[0-9]+-[0-9]+-[A-Za-z0-9]+|AIza[0-9A-Za-z_-]{35}|AKIA[0-9A-Z]{16})"
    message: >
      Hard-coded API token or service credential detected in '$VAR'.
      Rotate the credential immediately and store it in Vault or an environment
      variable (RULE-C03, ADR-0020).
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-798"
      references:
        - RULE-C03
        - ADR-0020

  - id: hardcoded-password-variable
    patterns:
      - pattern: $VAR = "$PWD"
      - metavariable-regex:
          metavariable: $VAR
          regex: "(?i)^(password|passwd|db_password|database_password|admin_password)$"
      - metavariable-regex:
          metavariable: $PWD
          regex: "^.{6,}$"
    message: >
      Hard-coded password in variable '$VAR'.
      Move the value to an environment variable or Vault path (RULE-C03, ADR-0020).
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-798"
      references:
        - RULE-C03
        - ADR-0020

  - id: hardcoded-secret-variable
    patterns:
      - pattern: $VAR = "$SECRET"
      - metavariable-regex:
          metavariable: $VAR
          regex: "(?i)^(secret|secret_key|client_secret|app_secret|jwt_secret|signing_secret)$"
      - metavariable-regex:
          metavariable: $SECRET
          regex: "^.{8,}$"
    message: >
      Hard-coded secret in variable '$VAR'.
      Store the value in Vault and retrieve it through SecretsPort (RULE-C03, ADR-0020).
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-798"
      references:
        - RULE-C03
        - ADR-0020
