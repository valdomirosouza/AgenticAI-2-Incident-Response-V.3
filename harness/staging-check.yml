# harness/staging-check.yml — Staging Gate
#
# Trigger:  Post-deploy to staging environment (after cd-staging.yml succeeds)
# Blocks:   Production deploy (cd-production.yml will not proceed if this gate fails)
# ADR:      ADR-0018 (DAST in staging), ADR-0009 (blue-green), ADR-0023 (HITL e2e)
# Spec:     specs/sdlc/07-release-process.md, specs/security/13-sast-dast-policy.md
#
# Staging URL resolved from environment: STAGING_BASE_URL
# All tests run against the staging environment only — never production.

version: "1"
harness: staging-check
trigger: post_staging_deploy
environment: staging

checks:
  # ─────────────────────────── DAST — PASSIVE ──────────────────────────────

  - id: S01
    name: zap-baseline-scan
    description: ZAP passive scan — zero Critical/High findings
    tool: owasp-zap
    scan_type: baseline
    command: >
      docker run --rm
      -v $(pwd)/reports:/zap/reports
      -e ZAP_BEARER_TOKEN=${ZAP_BEARER_TOKEN}
      ghcr.io/zaproxy/zaproxy:stable
      zap-baseline.py
      -t ${STAGING_BASE_URL}
      -c .zap/baseline.yml
      -r reports/zap/baseline-report.html
      -J reports/zap/baseline-report.json
    threshold:
      critical: 0
      high: 0
    failure_policy: block
    refs:
      - ADR-0018
      - specs/security/13-sast-dast-policy.md

  # ─────────────────────────── DAST — ACTIVE ───────────────────────────────

  - id: S02
    name: zap-active-scan
    description: ZAP active scan — zero Critical findings (staging only, synthetic account)
    tool: owasp-zap
    scan_type: active
    security_account: zap-scanner@copilot.test # Vault: secret/data/security/dast-accounts
    command: >
      docker run --rm
      -v $(pwd)/reports:/zap/reports
      -e ZAP_BEARER_TOKEN=${ZAP_SCANNER_TOKEN}
      ghcr.io/zaproxy/zaproxy:stable
      zap-full-scan.py
      -t ${STAGING_BASE_URL}
      -c .zap/active-scan.yml
      -r reports/zap/active-report.html
      -J reports/zap/active-report.json
    threshold:
      critical: 0
    failure_policy: block
    refs:
      - ADR-0018
      - specs/security/13-sast-dast-policy.md

  # ─────────────────────────── NUCLEI CVE PROBE ────────────────────────────

  - id: S03
    name: nuclei-cve-probe
    description: Nuclei CVE template scan — zero Critical template matches
    tool: nuclei
    command: >
      nuclei
      -target ${STAGING_BASE_URL}
      -tags cve
      -severity critical,high
      -rate-limit 50
      -output reports/nuclei/findings.json
      -json
    threshold:
      critical: 0
    failure_policy: block
    refs:
      - ADR-0018

  # ─────────────────────────── LLM SECURITY TESTS ──────────────────────────

  - id: S04
    name: prompt-injection-tests
    description: Prompt injection test suite (OWASP LLM01) — zero successful injections
    tool: pytest
    command: >
      pytest tests/security/prompt_injection/
      -v
      --tb=short
      -m staging
    threshold:
      failures: 0
    notes: Requires live LLM calls — only runs in staging gate, not PR gate
    failure_policy: block
    refs:
      - ADR-0021
      - specs/security/13-sast-dast-policy.md

  # ─────────────────────────── FUNCTIONAL E2E ──────────────────────────────

  - id: S05
    name: hitl-gate-e2e
    description: HITL gate end-to-end — ApprovalToken issued, validated, action executed
    tool: pytest
    command: >
      pytest tests/e2e/test_hitl_gate.py
      -v
      --tb=short
      -m staging
    threshold:
      failures: 0
    failure_policy: block
    refs:
      - ADR-0023
      - specs/ethics/16-autonomy-boundaries.md

  - id: S06
    name: audit-trail-write-e2e
    description: Every audit event written successfully — 100% write SLO
    tool: pytest
    command: >
      pytest tests/e2e/test_audit_trail.py
      -v
      --tb=short
      -m staging
    threshold:
      failures: 0
      write_success_rate: 100 # percent — ADR-0024 100% write SLO
    failure_policy: block
    refs:
      - ADR-0024
      - specs/ethics/17-audit-trail.md

  - id: S07
    name: pii-sanitizer-integration
    description: Zero PII detected in any LLM prompt sent to Anthropic API
    tool: pytest
    command: >
      pytest tests/integration/test_pii_sanitizer.py
      -v
      --tb=short
      -m staging
    threshold:
      failures: 0
      pii_in_prompt: 0
    failure_policy: block
    refs:
      - ADR-0028
      - specs/privacy/19-pii-inventory.md

  # ─────────────────────────── SLO SMOKE TEST ──────────────────────────────

  - id: S08
    name: slo-smoke-test
    description: Golden Signals within SLO targets for 5 minutes under synthetic load
    tool: k6
    command: >
      k6 run
      tests/load/smoke.js
      --env BASE_URL=${STAGING_BASE_URL}
      --out json=reports/k6/smoke.json
    duration: 5m
    thresholds:
      p95_latency_ms: 500 # SLO: p95 < 500ms (spec 09 Critical tier)
      error_rate_pct: 1 # SLO: error rate < 1% (spec 09)
      availability_pct: 99.9 # SLO: availability ≥ 99.9% (spec 09)
    failure_policy: block
    refs:
      - ADR-0011
      - specs/observability/09-slo-thresholds.md

  # ─────────────────────────── KILL-SWITCH DRILL ───────────────────────────

  - id: S09
    name: kill-switch-drill
    description: Kill-switch drill — RTO < 10s for staging environment
    tool: pytest
    command: >
      pytest tests/e2e/test_kill_switch.py
      -v
      --tb=short
      -m staging
    threshold:
      failures: 0
      rto_seconds: 10 # staging tolerance; production target is 60s (ADR-0025)
    failure_policy: block
    refs:
      - ADR-0025
      - specs/ethics/16-autonomy-boundaries.md

  # ─────────────────────────── BLOCKED ACTION GUARD ────────────────────────

  - id: S10
    name: blocked-action-enforcement
    description: Verify BLOCKED action types raise BlockedActionError at all 4 layers
    tool: pytest
    command: >
      pytest tests/unit/test_blocked_actions.py
      tests/integration/test_action_executor_blocked.py
      -v
      --tb=short
    threshold:
      failures: 0
    failure_policy: block
    refs:
      - ADR-0023
      - specs/ethics/16-autonomy-boundaries.md
