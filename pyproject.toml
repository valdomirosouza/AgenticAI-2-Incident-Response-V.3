[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "incident-response-copilot"
version = "0.6.7"
description = "Agentic AI Copilot for Incident Response — MTTD/MTTR reduction (PPGCA/Unisinos)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Valdomiro de Oliveira Souza Júnior", email = "valdomirojr@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
]
dynamic = ["dependencies"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Testing ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast unit tests (no I/O)",
    "integration: integration tests (require live adapters)",
    "e2e: end-to-end tests against staging",
    "security: OWASP / HITL enforcement tests",
    "staging: staging-only marker for k6 + DAST",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

# ── Coverage ───────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["src"]
omit = ["src/research/*", "tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

# ── Ruff (linting + formatting) ────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "S",        # bandit security rules
    "ANN",      # type annotations
]
ignore = [
    "ANN101",   # self annotation
    "ANN102",   # cls annotation
    "S101",     # assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

# ── Mypy ───────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "src/research/"]

# ── import-linter ──────────────────────────────────────────────────────────────

[tool.importlinter]
root_packages = ["src"]
include_external_packages = true

# ── Semgrep custom rules (referenced in harness/code-check.yml) ────────────────

[tool.semgrep]
config = "semgrep/"
